<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>配置修复 · Stowling</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/common.js" defer></script>
</head>
<body data-page="config-recovery">
    <header class="topbar">
        <div class="brand">
            <img class="brand-mark" src="/icon.png" width="36" height="36" alt="">
            <div>
                <h1>Stowling 控制台</h1>
                <p>配置修复</p>
            </div>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>
    <main>
        <section class="panel" aria-labelledby="config-recovery-title">
            <h2 id="config-recovery-title">配置需要修正</h2>
            <p>自动化已暂停。验证访问令牌后可查看出错的文件和原因。</p>
            <p>请先备份原文件，再按提示修正配置。保存后重启 Minecraft。</p>
            <div id="workspace" class="workspace page-workspace" aria-hidden="true">
                <div id="configuration-issues" class="config-errors" role="alert"></div>
            </div>
        </section>
        <div id="auth-shell"></div>
    </main>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
