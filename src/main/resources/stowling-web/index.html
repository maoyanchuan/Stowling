<!doctype html>
<html lang="zh-CN" data-theme="green">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/theme.js" blocking="render"></script>
    <title>状态概览 · Stowling</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/workbench.css">
    <script src="/common.js" defer></script>
    <script src="/settings-ui.js" defer></script>
    <script src="/dashboard.js" defer></script>
</head>
<body data-page="dashboard">
    <header class="topbar">
        <div class="brand">
            <img class="brand-mark" src="/icon.png" width="36" height="36" alt="">
            <div>
                <h1>Stowling 控制台</h1>
                <p>状态概览 · 坐标、区域与线性任务</p>
            </div>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>

    <main>
        <div id="auth-shell">
            <p class="route-loading" role="status">正在载入控制台…</p>
        </div>
        <div id="workspace" class="workspace page-workspace" aria-hidden="true">
            <nav id="app-nav" class="workspace-nav" aria-label="页面导航"></nav>

            <section class="dashboard-overview panel wide"
                     aria-labelledby="status-title" aria-busy="false">
                <div class="dashboard-overview-heading">
                    <div class="dashboard-overview-copy">
                        <h2 id="status-title">运行概览</h2>
                        <p id="dashboard-summary" class="dashboard-summary"
                           role="status">正在读取运行状态…</p>
                    </div>
                    <div class="dashboard-actions">
                        <a class="button-link primary" href="/tasks.html">打开任务</a>
                        <a class="button-link secondary"
                           href="/coordinates.html">管理坐标</a>
                        <button id="refresh-button" class="dashboard-sync"
                                type="button">立即同步</button>
                    </div>
                </div>
                <div class="status-grid dashboard-stats">
                    <article class="metric dashboard-metric">
                        <span>自动化状态</span>
                        <strong id="status-state" class="metric-value">--</strong>
                        <small>自动任务执行器</small>
                    </article>
                    <article class="metric dashboard-metric">
                        <span>坐标数量</span>
                        <strong id="coordinate-count"
                                class="metric-value">--</strong>
                        <small>可供任务引用</small>
                    </article>
                    <article class="metric dashboard-metric">
                        <span>任务数量</span>
                        <strong id="task-count"
                                class="metric-value">--</strong>
                        <small>已保存任务</small>
                    </article>
                    <article class="metric dashboard-metric">
                        <span>最近同步</span>
                        <strong id="status-observed"
                                class="metric-value metric-value--time">--</strong>
                        <small>每 5 秒自动刷新</small>
                    </article>
                </div>
                <div id="dashboard-errors" class="config-errors" role="alert"></div>
            </section>

            <section class="panel wide" aria-labelledby="trigger-status-title">
                <div class="panel-heading">
                    <div class="dashboard-section-title">
                        <h2 id="trigger-status-title">触发器状态</h2>
                        <span id="trigger-count" class="count-label">0</span>
                    </div>
                    <a class="text-link" href="/tasks.html">管理触发器</a>
                </div>
                <ol id="dashboard-trigger-status"
                    class="dashboard-list" aria-label="触发器状态"></ol>
            </section>

            <section class="panel wide" aria-labelledby="recent-title">
                <div class="panel-heading">
                    <div class="dashboard-section-title">
                        <h2 id="recent-title">运行记录</h2>
                        <span id="recent-count" class="count-label">0</span>
                    </div>
                    <a class="text-link" href="/tasks.html">查看全部</a>
                </div>
                <ol id="recent-tasks" class="dashboard-list activity-list"
                    aria-label="最近任务运行记录"></ol>
            </section>
        </div>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
