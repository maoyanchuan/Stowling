<!doctype html>
<html lang="zh-CN" data-theme="green">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>坐标管理 · Stowling</title>
    <style>
:root {
    color-scheme: dark;
    --bg: #111214;
    --bg-accent: #111214;
    --panel: #1c1d20;
    --panel-solid: #222326;
    --text: #e6e6e8;
    --muted: #9b9ca5;
    --line: #36373c;
    --accent: #b7c9c2;
    --accent-strong: #d5e8df;
    --accent-soft: #303b36;
    --danger: #f08b86;
    --shadow: none;
    --radius: 18px;
    --page-max-width: 1220px;
    --page-gutter: 24px;
    background: var(--bg);
    font-size: 14px;
}

:root[data-theme="green"] {
    color-scheme: light;
    --bg: #eff2ec;
    --bg-accent: #dce5da;
    --panel: rgba(255, 255, 255, 0.86);
    --panel-solid: #ffffff;
    --text: #18231c;
    --muted: #657168;
    --line: rgba(38, 64, 47, 0.16);
    --accent: #26704b;
    --accent-strong: #174b32;
    --accent-soft: #d9eee2;
    --danger: #a13d37;
    --shadow: 0 18px 50px rgba(32, 56, 40, 0.1);
    --theme-border: var(--line);
    --theme-focus: rgba(38, 112, 75, 0.25);
    --theme-input: rgba(255, 255, 255, 0.86);
    --theme-surface: var(--panel-solid);
    --theme-subtle: rgba(38, 112, 75, 0.04);
    --theme-hover: var(--accent-soft);
    --theme-selected: var(--accent-soft);
    --theme-selected-text: var(--accent-strong);
    --theme-primary-text: #ffffff;
    --theme-switch-off: #a6aca8;
    --theme-switch-on: var(--accent);
    --theme-page:
        radial-gradient(circle at 8% 5%, rgba(108, 158, 122, 0.24), transparent 31rem),
        radial-gradient(circle at 92% 4%, rgba(220, 189, 113, 0.19), transparent 27rem),
        linear-gradient(145deg, var(--bg), var(--bg-accent));
}

* {
    box-sizing: border-box;
}

body {
    min-width: 320px;
    min-height: 100vh;
    margin: 0;
    color: var(--text);
    background: var(--theme-page, var(--bg));
    font-family: Inter, "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    line-height: 1.5;
}

button,
input,
select {
    font: inherit;
}

button,
input,
select {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 2px solid var(--theme-focus, #a6bbb0);
    outline-offset: 3px;
}

button:disabled,
input:disabled,
select:disabled {
    cursor: not-allowed;
    opacity: 0.55;
}

::selection {
    color: var(--text);
    background: var(--accent-soft);
}

.page-header,
.page-main {
    width: min(var(--page-max-width), calc(100% - 2 * var(--page-gutter)));
    margin: 0 auto;
}

.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 22px 0;
    border-bottom: 1px solid var(--line);
}

.page-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-mark {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    color: #ffffff;
    background: var(--accent);
}

.brand-mark svg {
    width: 21px;
    height: 21px;
}

.page-brand strong {
    display: block;
    font-size: 17px;
    font-weight: 650;
}

.page-brand span {
    color: var(--muted);
    font-size: 13px;
}

.theme-picker {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--theme-subtle, #1a1b1e);
}

.theme-picker button {
    min-height: 36px;
    padding: 6px 12px;
    border: 0;
    border-radius: 6px;
    color: var(--muted);
    background: transparent;
}

.theme-picker button[aria-pressed="true"] {
    color: var(--theme-selected-text, #f1f1f3);
    background: var(--theme-selected, #3b3d44);
}

.page-main {
    padding: 30px 0 48px;
}

.page-heading {
    margin-bottom: 22px;
}

.page-heading h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 650;
}

.page-heading p {
    max-width: 65ch;
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.coordinate-shell {
    display: grid;
    grid-template-columns: minmax(230px, 290px) minmax(0, 1fr);
    overflow: visible;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
}

.coordinate-column {
    min-width: 0;
    padding: 22px;
}

.coordinate-library {
    display: flex;
    flex-direction: column;
    min-height: 540px;
    background: var(--theme-subtle, transparent);
    border-radius: calc(var(--radius) - 1px) 0 0 calc(var(--radius) - 1px);
}

.coordinate-editor {
    min-height: 540px;
    border-left: 1px solid var(--line);
}

.column-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.column-heading h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
}

.column-heading p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
}

.column-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
}

.coordinate-library .column-heading {
    display: block;
}

.coordinate-library .column-actions {
    justify-content: flex-start;
    margin-top: 12px;
}

.actions,
.editor-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
}

button {
    min-height: 40px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    background: var(--theme-surface, var(--panel-solid));
}

button:hover:not(:disabled) {
    border-color: var(--accent);
}

button.primary {
    border-color: var(--accent);
    color: var(--theme-primary-text, #17221c);
    background: var(--accent);
}

button.ghost {
    border-color: transparent;
    color: var(--theme-selected-text, var(--text));
    background: transparent;
}

button.danger {
    color: var(--danger);
}

.folder-create-form {
    display: grid;
    gap: 10px;
    margin: -4px 0 8px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--theme-surface, var(--panel-solid));
}

.folder-create-form .field-label {
    margin: 0;
}

.folder-form-actions {
    display: flex;
    gap: 6px;
}

.field-label {
    display: grid;
    gap: 7px;
    margin: 18px 0 0;
    color: var(--muted);
    font-size: 13px;
}

input,
select {
    width: 100%;
    min-height: 42px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    background: var(--theme-input, var(--panel-solid));
}

.coordinate-list {
    display: grid;
    gap: 4px;
    max-height: 360px;
    margin: 16px -8px 0;
    padding: 0 8px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-gutter: stable;
    overscroll-behavior: contain;
    overflow-anchor: none;
}

.coordinate-list.is-dragging {
    overflow-y: scroll;
}

.coordinate-item {
    position: relative;
    display: grid;
    align-items: center;
    grid-template-columns: minmax(0, 1fr);
    width: 100%;
    min-height: 46px;
    padding: 8px 12px;
    border: 1px solid transparent;
    border-radius: 10px;
    color: var(--text);
    background: transparent;
    text-align: left;
    cursor: grab;
    transition:
        background-color 160ms ease,
        box-shadow 160ms ease,
        transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
}

.coordinate-item:hover {
    background: var(--theme-hover, var(--accent-soft));
}

.coordinate-item:active {
    cursor: grabbing;
}

.coordinate-item.dragging {
    visibility: hidden;
    height: 0;
    min-height: 0;
    margin: 0;
    padding: 0;
    overflow: hidden;
    border: 0;
}

.coordinate-drop-placeholder {
    display: grid;
    place-items: center;
    min-height: 46px;
    border: 1px dashed var(--accent);
    border-radius: 10px;
    color: var(--accent-strong);
    background: var(--theme-selected, var(--accent-soft));
    font-size: 12px;
    font-weight: 650;
    animation: coordinate-placeholder-in 180ms cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes coordinate-placeholder-in {
    from {
        opacity: 0;
        transform: scaleY(0.72) translateY(-4px);
    }
    to {
        opacity: 1;
        transform: scaleY(1) translateY(0);
    }
}

.coordinate-item.drop-before {
    box-shadow: inset 0 2px 0 var(--accent);
}

.coordinate-item.drop-after {
    box-shadow: inset 0 -2px 0 var(--accent);
}

.coordinate-folder {
    display: grid;
    gap: 4px;
    margin-top: 6px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--theme-subtle, var(--panel-solid));
}

.coordinate-folder:first-child {
    margin-top: 0;
}

.coordinate-folder-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    min-height: 40px;
    padding: 8px 10px;
    padding-left: 28px;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--theme-selected-text, var(--text));
    background: var(--theme-selected, var(--accent-soft));
    text-align: left;
}

.coordinate-folder-header:hover,
.coordinate-folder-header.folder-drop-target {
    border-color: var(--accent);
}

.coordinate-folder-header strong {
    display: block;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 650;
}

.coordinate-folder-header::before {
    content: "";
    position: absolute;
    left: 11px;
    top: 50%;
    width: 7px;
    height: 7px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg);
    transform-origin: center;
    translate: 0 -60%;
    transition: transform 160ms ease;
}

.coordinate-folder[data-collapsed="true"] .coordinate-folder-header::before {
    transform: rotate(-45deg);
}

.coordinate-folder-count {
    flex: none;
    color: var(--muted);
    font-size: 11px;
}

.coordinate-folder-children {
    display: grid;
    gap: 4px;
    max-height: 1000px;
    padding: 0 1px 1px;
    overflow: hidden;
    opacity: 1;
    transition:
        max-height 220ms cubic-bezier(0.16, 1, 0.3, 1),
        opacity 150ms ease,
        padding 220ms cubic-bezier(0.16, 1, 0.3, 1);
}

.coordinate-folder[data-collapsed="true"] .coordinate-folder-children {
    max-height: 0;
    padding-block: 0;
    opacity: 0;
    pointer-events: none;
}

.coordinate-root-list {
    display: grid;
    gap: 4px;
    margin-top: 6px;
}

.coordinate-root-list.root-drop-target {
    min-height: 58px;
    padding: 6px;
    border: 1px dashed var(--accent);
    border-radius: 10px;
    background: var(--theme-selected, var(--accent-soft));
    box-shadow: 0 0 0 2px var(--theme-focus, rgba(38, 112, 75, 0.25));
}

.coordinate-root-empty {
    padding: 10px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
}

.coordinate-item[aria-current="true"] {
    border-color: var(--line);
    color: var(--theme-selected-text, var(--text));
    background: var(--theme-selected, var(--accent-soft));
}

.coordinate-item strong {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.coordinate-item strong {
    font-size: 14px;
    font-weight: 650;
}

.library-footer,
.editor-status {
    color: var(--muted);
    font-size: 12px;
}

.library-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--line);
}

.editor-form {
    max-width: 720px;
}

.editor-fields {
    display: grid;
    grid-template-columns: minmax(0, 1fr) repeat(3, minmax(90px, 0.5fr));
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
}

.editor-fields .field-label {
    margin: 0;
}

.editor-options {
    display: grid;
    grid-template-columns: minmax(0, 220px);
    gap: 16px;
    margin-top: 4px;
}

.editor-actions {
    justify-content: space-between;
    margin-top: 22px;
}

.editor-actions-main {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.editor-status {
    min-height: 20px;
    margin: 16px 0 0;
}

.editor-status[data-tone="success"] {
    color: var(--accent-strong);
}

.editor-status[data-tone="error"] {
    color: var(--danger);
}

.empty-state {
    display: grid;
    place-items: center;
    min-height: 430px;
    padding: 32px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    color: var(--muted);
    text-align: center;
}

.empty-state svg {
    width: 36px;
    height: 36px;
    margin-bottom: 12px;
    color: var(--accent);
}

.empty-state p {
    margin: 0;
}

[hidden] {
    display: none !important;
}

@media (max-width: 760px) {
    :root {
        --page-gutter: 16px;
    }

    .page-header {
        padding: 18px 0;
    }

    .page-main {
        padding-top: 22px;
    }

    .coordinate-shell {
        grid-template-columns: minmax(0, 1fr);
    }

    .coordinate-library {
        min-height: 0;
        border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
    }

    .coordinate-editor {
        min-height: 0;
        border-top: 1px solid var(--line);
        border-left: 0;
    }

    .coordinate-list {
        max-height: 250px;
    }

    .editor-fields {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .editor-fields .field-label:first-child {
        grid-column: 1 / -1;
    }
}

@media (max-width: 480px) {
    :root {
        --page-gutter: 12px;
    }

    .page-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .theme-picker {
        width: 100%;
    }

    .theme-picker button {
        flex: 1;
    }

    .coordinate-column {
        padding: 18px;
    }

    .editor-fields,
    .editor-options {
        grid-template-columns: minmax(0, 1fr);
    }

    .editor-fields .field-label:first-child {
        grid-column: auto;
    }
}

@media (prefers-reduced-motion: reduce) {
    * {
        scroll-behavior: auto !important;
    }
}
    </style>
</head>
<body>
    <header class="page-header">
        <div class="page-brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"/>
                    <circle cx="12" cy="9" r="2.2"/>
                </svg>
            </span>
            <div>
                <strong>Stowling 控制台</strong>
                <span>坐标管理</span>
            </div>
        </div>
        <div class="theme-picker" aria-label="主题切换">
            <button type="button" data-theme-choice="green" aria-pressed="true">
                浅绿
            </button>
            <button type="button" data-theme-choice="gray" aria-pressed="false">
                深灰
            </button>
        </div>
    </header>

    <main class="page-main">
        <div class="page-heading">
            <h1>坐标管理</h1>
            <p>集中维护任务会用到的常用位置。选择左侧坐标，在右侧编辑名称和三维坐标。</p>
        </div>

        <section class="coordinate-shell" aria-label="坐标管理与编辑">
            <aside class="coordinate-column coordinate-library" aria-labelledby="library-title">
                <div class="column-heading">
                    <div>
                        <h2 id="library-title">坐标管理</h2>
                        <p>选择一个坐标开始编辑</p>
                    </div>
                    <div class="column-actions">
                        <button id="add-coordinate" class="primary" type="button">添加坐标</button>
                        <button id="add-folder" type="button">新建文件夹</button>
                    </div>
                </div>

                <form id="folder-form" class="folder-create-form" hidden>
                    <label class="field-label" for="folder-name">
                        文件夹名称
                        <input id="folder-name" maxlength="40" required>
                    </label>
                    <div class="folder-form-actions">
                        <button class="primary" type="submit">创建文件夹</button>
                        <button id="cancel-folder" class="ghost" type="button">取消</button>
                    </div>
                </form>

                <div id="coordinate-list" class="coordinate-list" role="listbox"
                     aria-label="坐标列表"></div>
                <p id="library-footer" class="library-footer" role="status"></p>
            </aside>

            <section class="coordinate-column coordinate-editor" aria-labelledby="editor-title">
                <div id="editor-empty" class="empty-state" hidden>
                    <div>
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"/>
                            <circle cx="12" cy="9" r="2.2"/>
                        </svg>
                        <p>还没有坐标，点击左侧“添加”创建一个。</p>
                    </div>
                </div>

                <div id="editor-content">
                    <div class="column-heading">
                        <div>
                            <h2 id="editor-title">坐标编辑</h2>
                            <p id="editor-subtitle">编辑当前坐标的基本信息</p>
                        </div>
                    </div>

                    <form id="coordinate-form" class="editor-form">
                        <div class="editor-fields">
                            <label class="field-label" for="coordinate-name">
                                名称
                                <input id="coordinate-name" name="name" maxlength="80" required>
                            </label>
                            <label class="field-label" for="coordinate-x">
                                X
                                <input id="coordinate-x" name="x" type="number" step="1" required>
                            </label>
                            <label class="field-label" for="coordinate-y">
                                Y
                                <input id="coordinate-y" name="y" type="number" step="1" required>
                            </label>
                            <label class="field-label" for="coordinate-z">
                                Z
                                <input id="coordinate-z" name="z" type="number" step="1" required>
                            </label>
                        </div>

                        <div class="editor-options">
                            <label class="field-label" for="coordinate-radius">
                                到达半径
                                <input id="coordinate-radius" name="radius" type="number" min="0"
                                       max="128" step="1" required>
                            </label>
                        </div>

                        <div class="editor-actions">
                            <div class="editor-actions-main">
                                <button class="primary" type="submit">保存坐标</button>
                                <button id="duplicate-coordinate" type="button">复制坐标</button>
                            </div>
                            <button id="delete-coordinate" class="ghost danger" type="button">
                                删除坐标
                            </button>
                        </div>
                        <p id="editor-status" class="editor-status" role="status" aria-live="polite">
                        </p>
                    </form>
                </div>
            </section>
        </section>
    </main>

    <script>
(() => {
    "use strict";

    /** @typedef {{id: string, name: string, x: number, y: number, z: number,
     * radius: number, folderId: string}} Coordinate */

    const folders = [
        {id: "common", name: "常用位置", collapsed: false}
    ];
    const coordinates = [
        {id: "home", name: "主城", x: 128, y: 64, z: -32, radius: 3, folderId: "common"},
        {id: "warehouse", name: "仓库入口", x: 166, y: 65, z: -18, radius: 2,
            folderId: "common"},
        {id: "portal", name: "下界入口", x: 12, y: 72, z: 8, radius: 1, folderId: ""}
    ];
    const state = {selectedId: coordinates[0]?.id || ""};
    let draggedId = "";
    let draggedItem = null;
    let dropPlaceholder = null;
    let placeholderLocation = "";
    const nodes = {
        list: document.querySelector("#coordinate-list"),
        add: document.querySelector("#add-coordinate"),
        addFolder: document.querySelector("#add-folder"),
        folderForm: document.querySelector("#folder-form"),
        folderName: document.querySelector("#folder-name"),
        cancelFolder: document.querySelector("#cancel-folder"),
        footer: document.querySelector("#library-footer"),
        empty: document.querySelector("#editor-empty"),
        content: document.querySelector("#editor-content"),
        subtitle: document.querySelector("#editor-subtitle"),
        form: document.querySelector("#coordinate-form"),
        name: document.querySelector("#coordinate-name"),
        x: document.querySelector("#coordinate-x"),
        y: document.querySelector("#coordinate-y"),
        z: document.querySelector("#coordinate-z"),
        radius: document.querySelector("#coordinate-radius"),
        duplicate: document.querySelector("#duplicate-coordinate"),
        remove: document.querySelector("#delete-coordinate"),
        status: document.querySelector("#editor-status")
    };

    /** @returns {void} */
    function clearDropTargets() {
        nodes.list.querySelectorAll(".folder-drop-target").forEach(target => {
            target.classList.remove("folder-drop-target");
        });
        nodes.list.querySelectorAll(".drop-before, .drop-after").forEach(target => {
            target.classList.remove("drop-before", "drop-after");
        });
        nodes.list.querySelectorAll(".root-drop-target").forEach(target => {
            target.classList.remove("root-drop-target");
        });
    }

    /** @returns {Map<Element, number>} */
    function captureCoordinatePositions() {
        const positions = new Map();
        nodes.list.querySelectorAll(".coordinate-item:not(.dragging)").forEach(item => {
            positions.set(item, item.getBoundingClientRect().top);
        });
        return positions;
    }

    /** @param {Map<Element, number>} previous @returns {void} */
    function animateCoordinateShift(previous) {
        const reduced = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
        if (reduced || !Element.prototype.animate) return;
        nodes.list.querySelectorAll(".coordinate-item:not(.dragging)").forEach(item => {
            const before = previous.get(item);
            if (before === undefined) return;
            const delta = before - item.getBoundingClientRect().top;
            if (Math.abs(delta) < 1) return;
            item.animate(
                [{transform: `translateY(${delta}px)`}, {transform: "translateY(0)"}],
                {duration: 220, easing: "cubic-bezier(0.16, 1, 0.3, 1)"}
            );
        });
    }

    /** @param {HTMLElement} host @param {HTMLElement|null} before
     * @param {string} text @param {string} location @returns {void} */
    function movePlaceholder(host, before, text, location) {
        if (!dropPlaceholder) return;
        if (placeholderLocation === location) return;
        const previous = captureCoordinatePositions();
        placeholderLocation = location;
        dropPlaceholder.textContent = text;
        if (before) before.before(dropPlaceholder);
        else host.append(dropPlaceholder);
        animateCoordinateShift(previous);
    }

    /** @param {HTMLElement} host @param {number} clientY
     * @returns {HTMLElement|null} */
    function coordinateDropTarget(host, clientY) {
        return Array.from(host.querySelectorAll(
            ":scope > .coordinate-item:not(.dragging)"
        )).find(item => clientY < item.getBoundingClientRect().top
            + item.getBoundingClientRect().height / 2) || null;
    }

    /** @param {string} folderId @param {string} [beforeId] @returns {boolean} */
    function placeDraggedCoordinate(folderId, beforeId = "") {
        const sourceIndex = coordinates.findIndex(value => value.id === draggedId);
        if (sourceIndex < 0) return false;
        const [moved] = coordinates.splice(sourceIndex, 1);
        moved.folderId = folderId;
        const targetIndex = beforeId
            ? coordinates.findIndex(value => value.id === beforeId)
            : -1;
        coordinates.splice(targetIndex < 0 ? coordinates.length : targetIndex, 0, moved);
        return true;
    }

    /** @param {Coordinate} coordinate @param {HTMLElement} host @returns {void} */
    function renderItem(coordinate, host) {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "coordinate-item";
        item.draggable = true;
        item.dataset.coordinateId = coordinate.id;
        item.setAttribute("role", "option");
        item.setAttribute("aria-selected", String(coordinate.id === state.selectedId));
        item.setAttribute("aria-current", String(coordinate.id === state.selectedId));
        item.innerHTML = "<strong></strong>";
        item.querySelector("strong").textContent = coordinate.name;
        item.addEventListener("click", () => {
            state.selectedId = coordinate.id;
            setStatus("");
            render();
        });
        item.addEventListener("dragstart", event => {
            draggedId = coordinate.id;
            draggedItem = item;
            item.classList.add("dragging");
            nodes.list.classList.add("is-dragging");
            dropPlaceholder = document.createElement("div");
            dropPlaceholder.className = "coordinate-drop-placeholder";
            dropPlaceholder.textContent = "放到这里";
            item.before(dropPlaceholder);
            if (event.dataTransfer) {
                event.dataTransfer.effectAllowed = "move";
                event.dataTransfer.setData("text/plain", coordinate.id);
            }
        });
        item.addEventListener("dragend", clearDragState);
        item.addEventListener("dragover", event => {
            if (!draggedId || draggedId === coordinate.id) return;
            event.preventDefault();
            if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
            clearDropTargets();
            const before = event.clientY < item.getBoundingClientRect().top
                + item.getBoundingClientRect().height / 2;
            movePlaceholder(
                host,
                before ? item : item.nextElementSibling,
                "放到这里",
                `coordinate:${coordinate.id}:${before ? "before" : "after"}`
            );
        });
        item.addEventListener("drop", event => {
            event.preventDefault();
            const sourceIndex = coordinates.findIndex(value => value.id === draggedId);
            const targetIndex = coordinates.findIndex(value => value.id === coordinate.id);
            if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) return;
            const before = event.clientY < item.getBoundingClientRect().top
                + item.getBoundingClientRect().height / 2;
            const [moved] = coordinates.splice(sourceIndex, 1);
            let insertIndex = coordinates.findIndex(value => value.id === coordinate.id);
            if (!before) insertIndex += 1;
            moved.folderId = coordinate.folderId;
            coordinates.splice(insertIndex, 0, moved);
            clearDragState();
            setStatus("已调整坐标顺序。", "success");
            render();
        });
        host.append(item);
    }

    /** @param {object} folder @returns {void} */
    function renderFolder(folder) {
        const section = document.createElement("section");
        section.className = "coordinate-folder";
        section.dataset.collapsed = String(folder.collapsed);
        const header = document.createElement("button");
        header.type = "button";
        header.className = "coordinate-folder-header";
        header.setAttribute("aria-expanded", String(!folder.collapsed));
        const title = document.createElement("strong");
        title.textContent = folder.name;
        const count = document.createElement("span");
        count.className = "coordinate-folder-count";
        count.textContent = `${coordinates.filter(value => value.folderId === folder.id).length}`;
        header.append(title, count);
        header.addEventListener("click", () => {
            folder.collapsed = !folder.collapsed;
            section.dataset.collapsed = String(folder.collapsed);
            header.setAttribute("aria-expanded", String(!folder.collapsed));
            children.dataset.collapsed = String(folder.collapsed);
            children.inert = folder.collapsed;
        });
        header.addEventListener("dragover", event => {
            if (!draggedId) return;
            event.preventDefault();
            if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
            clearDropTargets();
            header.classList.add("folder-drop-target");
            if (!folder.collapsed) {
                movePlaceholder(children, null, "放到这里", `folder:${folder.id}`);
            } else {
                dropPlaceholder?.remove();
                placeholderLocation = "";
            }
        });
        header.addEventListener("drop", event => {
            if (!draggedId) return;
            event.preventDefault();
            const index = coordinates.findIndex(value => value.id === draggedId);
            if (index < 0) return;
            const [moved] = coordinates.splice(index, 1);
            moved.folderId = folder.id;
            coordinates.push(moved);
            folder.collapsed = false;
            clearDragState();
            setStatus(`已移入文件夹“${folder.name}”。`, "success");
            render();
        });

        const children = document.createElement("div");
        children.className = "coordinate-folder-children";
        children.dataset.collapsed = String(folder.collapsed);
        children.inert = folder.collapsed;
        section.addEventListener("dragover", event => {
            if (!draggedId || event.target.closest(".coordinate-folder-header")
                    || event.target.closest(".coordinate-item")) return;
            event.preventDefault();
            if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
            clearDropTargets();
            header.classList.add("folder-drop-target");
            const target = coordinateDropTarget(children, event.clientY);
            const location = target
                ? `folder:${folder.id}:before:${target.dataset.coordinateId}`
                : `folder:${folder.id}:end`;
            movePlaceholder(children, target, "放到这里", location);
        });
        section.addEventListener("drop", event => {
            if (!draggedId || event.target.closest(".coordinate-folder-header")
                    || event.target.closest(".coordinate-item")) return;
            event.preventDefault();
            const target = coordinateDropTarget(children, event.clientY);
            const beforeId = target?.dataset.coordinateId || "";
            if (!placeDraggedCoordinate(folder.id, beforeId)) return;
            folder.collapsed = false;
            clearDragState();
            setStatus(`已移入文件夹“${folder.name}”。`, "success");
            render();
        });
        coordinates.filter(value => value.folderId === folder.id)
            .forEach(coordinate => renderItem(coordinate, children));
        section.append(header, children);
        nodes.list.append(section);
    }

    /** @returns {Coordinate | undefined} */
    function selectedCoordinate() {
        return coordinates.find(coordinate => coordinate.id === state.selectedId);
    }

    /** @param {HTMLElement} root @returns {void} */
    function moveCoordinateToRoot(root) {
        const index = coordinates.findIndex(value => value.id === draggedId);
        if (index < 0) return;
        const [moved] = coordinates.splice(index, 1);
        moved.folderId = "";
        let beforeId = "";
        let next = dropPlaceholder?.nextElementSibling;
        while (next) {
            if (next.classList.contains("coordinate-item")
                    && next.dataset.coordinateId !== moved.id) {
                beforeId = next.dataset.coordinateId;
                break;
            }
            next = next.nextElementSibling;
        }
        const insertIndex = beforeId
            ? coordinates.findIndex(value => value.id === beforeId)
            : coordinates.length;
        coordinates.splice(insertIndex < 0 ? coordinates.length : insertIndex, 0, moved);
        clearDragState();
        setStatus("已移到根目录。", "success");
        render();
    }

    /** @param {string} message @param {string} [tone] @returns {void} */
    function setStatus(message, tone = "") {
        nodes.status.textContent = message;
        if (tone) nodes.status.dataset.tone = tone;
        else delete nodes.status.dataset.tone;
    }

    /** @returns {void} */
    function clearDragState() {
        draggedItem?.classList.remove("dragging");
        dropPlaceholder?.remove();
        draggedItem = null;
        dropPlaceholder = null;
        draggedId = "";
        placeholderLocation = "";
        nodes.list.classList.remove("is-dragging");
        clearDropTargets();
    }

    /** @param {HTMLElement} root @returns {void} */
    function bindRootDrop(root) {
        root.addEventListener("dragover", event => {
            if (!draggedId || event.target.closest(".coordinate-item")
                    || event.target.closest(".coordinate-folder")) return;
            event.preventDefault();
            if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
            clearDropTargets();
            root.classList.add("root-drop-target");
            const target = Array.from(root.querySelectorAll(":scope > .coordinate-item"))
                .find(item => event.clientY < item.getBoundingClientRect().top
                    + item.getBoundingClientRect().height / 2);
            const location = target
                ? `root-before:${target.dataset.coordinateId}` : "root-end";
            movePlaceholder(root, target, "放到这里", location);
        });
        root.addEventListener("drop", event => {
            if (!draggedId || event.target.closest(".coordinate-item")
                    || event.target.closest(".coordinate-folder")) return;
            event.preventDefault();
            moveCoordinateToRoot(root);
        });
    }

    /** @returns {void} */
    function render() {
        nodes.list.replaceChildren();
        folders.forEach(renderFolder);
        const root = document.createElement("div");
        root.className = "coordinate-root-list";
        bindRootDrop(root);
        coordinates.filter(coordinate => !coordinate.folderId)
            .forEach(coordinate => renderItem(coordinate, root));
        if (!root.children.length) {
            root.append(document.createElement("div"));
            root.firstElementChild.className = "coordinate-root-empty";
            root.firstElementChild.textContent = "根目录暂无坐标";
        }
        nodes.list.append(root);
        nodes.footer.textContent = `${coordinates.length} 个坐标 · ${folders.length} 个文件夹`;

        const coordinate = selectedCoordinate();
        const hasCoordinate = Boolean(coordinate);
        nodes.empty.hidden = hasCoordinate;
        nodes.content.hidden = !hasCoordinate;
        if (!coordinate) return;
        nodes.subtitle.textContent = `${coordinate.x}, ${coordinate.y}, ${coordinate.z}`;
        nodes.name.value = coordinate.name;
        nodes.x.value = String(coordinate.x);
        nodes.y.value = String(coordinate.y);
        nodes.z.value = String(coordinate.z);
        nodes.radius.value = String(coordinate.radius);
    }

    /** @returns {string} */
    function nextId() {
        return `coordinate-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    /** @returns {void} */
    function addCoordinate() {
        const coordinate = {
            id: nextId(),
            name: "新坐标",
            x: 0,
            y: 64,
            z: 0,
            radius: 3,
            folderId: ""
        };
        coordinates.unshift(coordinate);
        state.selectedId = coordinate.id;
        setStatus("已创建草稿，请保存坐标。", "success");
        render();
        nodes.name.focus();
        nodes.name.select();
    }

    /** @returns {void} */
    function showFolderForm() {
        nodes.folderForm.hidden = false;
        nodes.folderName.value = "";
        nodes.folderName.focus();
    }

    /** @returns {void} */
    function hideFolderForm() {
        nodes.folderForm.hidden = true;
        nodes.folderName.value = "";
    }

    /** @returns {void} */
    function createFolder() {
        const name = nodes.folderName.value.trim();
        if (!name) return;
        folders.push({id: nextId(), name, collapsed: false});
        hideFolderForm();
        setStatus(`已创建文件夹“${name}”。`, "success");
        render();
    }

    /** @param {string} value @returns {number | null} */
    function integerValue(value) {
        const parsed = Number(value);
        return Number.isInteger(parsed) ? parsed : null;
    }

    /** @returns {void} */
    function saveCoordinate() {
        const coordinate = selectedCoordinate();
        if (!coordinate) return;
        const values = [nodes.x.value, nodes.y.value, nodes.z.value, nodes.radius.value]
            .map(integerValue);
        if (!nodes.name.value.trim() || values.some(value => value === null)) {
            setStatus("请填写名称和有效的整数坐标。", "error");
            return;
        }
        [coordinate.x, coordinate.y, coordinate.z, coordinate.radius] = values;
        coordinate.name = nodes.name.value.trim();
        setStatus("已保存坐标。", "success");
        render();
    }

    /** @returns {void} */
    function duplicateCoordinate() {
        const source = selectedCoordinate();
        if (!source) return;
        const copy = {...source, id: nextId(), name: `${source.name} 副本`};
        coordinates.splice(coordinates.indexOf(source) + 1, 0, copy);
        state.selectedId = copy.id;
        setStatus("已复制坐标，请按需修改后保存。", "success");
        render();
        nodes.name.focus();
        nodes.name.select();
    }

    /** @returns {void} */
    function deleteCoordinate() {
        const coordinate = selectedCoordinate();
        if (!coordinate || !window.confirm(`删除坐标“${coordinate.name}”？`)) return;
        const index = coordinates.indexOf(coordinate);
        coordinates.splice(index, 1);
        state.selectedId = coordinates[index]?.id || coordinates[index - 1]?.id || "";
        setStatus(coordinates.length ? "已删除坐标。" : "坐标列表为空。", "success");
        render();
    }

    /** @param {string} theme @param {boolean} [persist] @returns {void} */
    function setTheme(theme, persist = false) {
        const selected = theme === "gray" ? "gray" : "green";
        document.documentElement.dataset.theme = selected;
        document.querySelectorAll("[data-theme-choice]").forEach(button => {
            button.setAttribute("aria-pressed", String(button.dataset.themeChoice === selected));
        });
        if (!persist) return;
        try {
            window.localStorage.setItem("stowling.coordinate-template.theme", selected);
        } catch {
            // Theme switching remains available when storage is unavailable.
        }
    }

    nodes.add.addEventListener("click", addCoordinate);
    nodes.addFolder.addEventListener("click", showFolderForm);
    nodes.cancelFolder.addEventListener("click", hideFolderForm);
    nodes.folderForm.addEventListener("submit", event => {
        event.preventDefault();
        createFolder();
    });
    nodes.form.addEventListener("submit", event => {
        event.preventDefault();
        saveCoordinate();
    });
    nodes.duplicate.addEventListener("click", duplicateCoordinate);
    nodes.remove.addEventListener("click", deleteCoordinate);
    document.querySelectorAll("[data-theme-choice]").forEach(button => {
        button.addEventListener("click", () => setTheme(button.dataset.themeChoice, true));
    });

    let savedTheme = "green";
    try {
        savedTheme = window.localStorage.getItem("stowling.coordinate-template.theme") || "green";
    } catch {
        // The standalone preview works without local storage.
    }
    setTheme(savedTheme);
    render();
})();
    </script>
</body>
</html>
