<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="refresh"
          content="0; url=/coordinates.html#category-zones">
    <title>分类区管理 · Stowling</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/common.js" defer></script>
    <script src="/category-zone-model.js" defer></script>
    <script src="/category-zones.js" defer></script>
</head>
<body data-page="category-zones">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">S</span>
            <div>
                <h1>Stowling 控制台</h1>
                <p>分类区管理 · 手动绑定或按单片母版自动铺满</p>
            </div>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>

    <main>
        <div id="auth-shell"></div>
        <div id="workspace" class="workspace page-workspace" aria-hidden="true">
            <nav id="app-nav" class="workspace-nav" aria-label="页面导航"></nav>

            <section class="panel wide" aria-labelledby="category-zone-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">仓库分类</p>
                        <h2 id="category-zone-title">分类区
                            <span id="category-zone-list-count"
                                  class="count-label">0</span></h2>
                        <p class="muted section-help">
                            将展示物品与储存容器配对。先设置范围，再按需调整识别规则。
                        </p>
                        <details class="inline-help">
                            <summary>分类区如何工作？</summary>
                            <p class="compact-help">
                                展示框、展示架和摆放方块会自动转换为物品 ID，
                                与同一列储存容器精确匹配。长条分类架可框选总选区，
                                再填写多个母版分类物并设置方向、步长。
                            </p>
                        </details>
                    </div>
                    <button id="add-category-zone-button"
                            class="primary compact"
                            type="button">添加分类区</button>
                </div>

                <form id="new-category-zone-form" hidden>
                    <div class="coordinate-create-heading">
                        <div>
                            <p class="eyebrow">新增资源</p>
                            <h3>添加分类区</h3>
                        </div>
                        <button id="cancel-category-zone-button"
                                class="ghost compact"
                                type="button">关闭</button>
                    </div>
                    <div class="editor-field category-zone-name-field">
                        <label for="new-category-zone-name">分类区名称</label>
                        <input id="new-category-zone-name"
                               maxlength="80" required>
                    </div>
                    <div class="resource-section-heading">
                        <div>
                                <h3>范围模式与单片母版</h3>
                            <p class="muted compact-help">
                                    自动铺满的单片母版可添加多个分类物；
                                    所有范围必须完整位于总选区内，并且每组
                                    识别区与储存区等长。
                            </p>
                        </div>
                    </div>
                    <div id="new-category-bindings"
                         class="category-binding-list category-zone-binding-list">
                    </div>
                    <div class="action-row">
                        <button id="add-new-binding-button"
                                class="secondary compact"
                                type="button">添加绑定</button>
                        <button class="primary compact"
                                type="submit">保存分类区</button>
                    </div>
                </form>

                <div class="resource-toolbar">
                    <label class="search-field" for="category-zone-search">
                        <span>查找分类区</span>
                        <input id="category-zone-search" type="search"
                               placeholder="搜索名称或范围坐标" autocomplete="off">
                    </label>
                    <span class="compact-help">
                        点击名称展开编辑 · 识别规则按需展开
                    </span>
                </div>

                <div id="category-zone-list"
                     class="editor-list" aria-live="polite"></div>
                <div id="category-zone-errors"
                     class="config-errors" role="alert"></div>
                <div class="coordinate-footer">
                    <span id="category-zone-status">尚未读取分类区</span>
                    <code id="category-zone-revision">配置版本：--</code>
                </div>
            </section>
        </div>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite"
         aria-atomic="true"></div>
</body>
</html>
