<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>状态概览 · Stowling</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/workbench.css">
    <script src="/common.js" defer></script>
    <script src="/settings-ui.js" defer></script>
    <script src="/dashboard.js" defer></script>
</head>
<body data-page="dashboard">
    <header class="topbar">
        <div class="brand">
            <img class="brand-mark" src="/icon.png" width="36" height="36" alt="">
            <div>
                <h1>Stowling 控制台</h1>
                <p>状态概览 · 坐标、区域与线性任务</p>
            </div>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>

    <main>
        <div id="auth-shell"></div>
        <div id="workspace" class="workspace page-workspace" aria-hidden="true">
            <nav id="app-nav" class="workspace-nav" aria-label="页面导航"></nav>

            <section class="hero panel">
                <div>
                    <p class="eyebrow">仓库自动化</p>
                    <h2>任务与仓库，一处掌握</h2>
                    <p class="muted hero-copy">
                        查看执行状态，配置收集与分类，管理坐标和仓库范围。
                    </p>
                </div>
                <div class="hero-actions">
                    <a class="button-link primary" href="/tasks.html">打开任务</a>
                    <a class="button-link secondary" href="/coordinates.html">管理坐标</a>
                </div>
            </section>

            <section class="panel wide" aria-labelledby="status-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">实时状态</p>
                        <h2 id="status-title">运行概览</h2>
                    </div>
                    <button id="refresh-button" class="secondary compact"
                            type="button">立即同步</button>
                </div>
                <div class="status-grid">
                    <article class="metric">
                        <span>自动化状态</span>
                        <strong id="status-state">--</strong>
                    </article>
                    <article class="metric">
                        <span>坐标数量</span>
                        <strong id="coordinate-count">--</strong>
                    </article>
                    <article class="metric">
                        <span>任务数量</span>
                        <strong id="task-count">--</strong>
                    </article>
                    <article class="metric">
                        <span>最近同步</span>
                        <strong id="status-observed">--</strong>
                    </article>
                </div>
                <div id="dashboard-errors" class="config-errors" role="alert"></div>
            </section>

            <section class="panel wide" aria-labelledby="trigger-status-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">后台条件</p>
                        <h2 id="trigger-status-title">触发器状态</h2>
                    </div>
                    <a class="text-link" href="/tasks.html#task-monitor">查看监听状态</a>
                </div>
                <div id="dashboard-trigger-status" class="card-list"
                     aria-live="polite"></div>
            </section>

            <section class="panel wide" aria-labelledby="recent-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">最近任务</p>
                        <h2 id="recent-title">运行记录</h2>
                    </div>
                    <a class="text-link" href="/tasks.html#task-monitor">查看全部</a>
                </div>
                <div id="recent-tasks" class="card-list" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
