<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>库存查询 · Stowling</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/common.js" defer></script>
    <script src="/storage.js" defer></script>
</head>
<body data-page="storage">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">S</span>
            <div>
                <h1>库存查询</h1>
                <p>查看库存来源、采集时间与数据有效性</p>
            </div>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>

    <main>
        <div id="auth-shell"></div>
        <div id="workspace" class="workspace page-workspace" aria-hidden="true">
            <nav id="app-nav" class="workspace-nav" aria-label="页面导航"></nav>

            <section class="panel wide" aria-labelledby="inventory-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">只读库存</p>
                        <h2 id="inventory-title">库存快照</h2>
                        <p class="muted section-help">
                            “刷新库存”只重新读取已有快照，不会发起盘点或改变游戏状态。
                        </p>
                    </div>
                    <button id="refresh-storage-button" class="primary compact"
                            type="button">刷新库存</button>
                </div>
                <div class="inventory-summary">
                    <span>快照数量</span>
                    <strong id="inventory-count">--</strong>
                    <span>最近读取</span>
                    <strong id="inventory-observed">--</strong>
                </div>
                <div class="filter-row inventory-filter-row">
                    <div class="editor-field">
                        <label for="inventory-filter-item">物品 ID</label>
                        <input id="inventory-filter-item" type="search"
                               placeholder="例如 minecraft:iron_ingot">
                    </div>
                    <div class="editor-field">
                        <label for="inventory-filter-container">容器 / 来源</label>
                        <input id="inventory-filter-container" type="search"
                               placeholder="按容器或来源 ID 筛选">
                    </div>
                </div>
                <p id="storage-message" class="field-message" role="status"></p>
                <div id="inventory-list" class="inventory-list" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite"
         aria-atomic="true"></div>
</body>
</html>
