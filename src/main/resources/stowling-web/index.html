<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>状态概览 · Stowling</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/common.js" defer></script>
    <script src="/dashboard.js" defer></script>
</head>
<body data-page="dashboard">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">S</span>
            <div>
                <h1>Stowling 控制台</h1>
                <p>Minecraft 26.2 · 可编排客户端机器人</p>
            </div>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>

    <main>
        <div id="auth-shell"></div>
        <div id="workspace" class="workspace page-workspace" aria-hidden="true">
            <nav id="app-nav" class="workspace-nav" aria-label="页面导航"></nav>

            <section class="hero panel">
                <div>
                    <p class="eyebrow">自动化工作台</p>
                    <h2>把机器人动作组合成自己的任务</h2>
                    <p class="muted hero-copy">
                        命名坐标是共享的位置字典，任务由导航、等待、拾取、容器搬运、
                        库存检查和制作等模块串联而成。
                    </p>
                </div>
                <div class="hero-actions">
                    <a class="button-link primary" href="/tasks.html">打开任务编排</a>
                    <a class="button-link secondary" href="/coordinates.html">管理命名坐标</a>
                </div>
            </section>

            <section class="panel wide" aria-labelledby="status-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">实时状态</p>
                        <h2 id="status-title">运行概览</h2>
                    </div>
                    <button id="refresh-button" class="secondary compact" type="button">
                        立即同步
                    </button>
                </div>
                <div class="status-grid">
                    <article class="metric">
                        <span>自动化状态</span>
                        <strong id="status-state">--</strong>
                    </article>
                    <article class="metric">
                        <span>暂停</span>
                        <strong id="status-paused">--</strong>
                    </article>
                    <article class="metric">
                        <span>最近同步</span>
                        <strong id="status-observed">--</strong>
                        <small>每 5 秒自动同步机器人状态</small>
                    </article>
                </div>
                <div class="task-state-grid" aria-live="polite">
                    <article class="task-state-column">
                        <div class="task-state-heading">
                            <h3>正在运行</h3>
                            <span id="running-task-count" class="task-state-count">0</span>
                        </div>
                        <div id="running-task-list" class="compact-task-list"></div>
                    </article>
                    <article class="task-state-column">
                        <div class="task-state-heading">
                            <h3>排队中</h3>
                            <span id="queued-task-count" class="task-state-count">0</span>
                        </div>
                        <div id="queued-task-list" class="compact-task-list"></div>
                    </article>
                    <article class="task-state-column">
                        <div class="task-state-heading">
                            <h3>已中断</h3>
                            <span id="interrupted-task-count" class="task-state-count">0</span>
                        </div>
                        <div id="interrupted-task-list" class="compact-task-list"></div>
                    </article>
                </div>
            </section>

            <section class="panel" aria-labelledby="control-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">机器人控制</p>
                        <h2 id="control-title">远程控制</h2>
                    </div>
                </div>
                <label class="control-target-label" for="control-task-select">任务列表</label>
                <select id="control-task-select" class="control-task-select" disabled>
                    <option value="">暂无活动任务</option>
                </select>
                <div class="action-row">
                    <button id="pause-button" class="secondary" type="button">暂停机器人</button>
                    <button id="resume-button" class="secondary" type="button">恢复机器人</button>
                    <button id="cancel-task-button" class="secondary" type="button" disabled>
                        取消所选任务
                    </button>
                    <button id="reload-button" class="secondary" type="button">重载配置</button>
                </div>
                <p id="control-message" class="field-message" role="status"></p>
            </section>

            <section class="panel wide" aria-labelledby="resources-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">资源摘要</p>
                        <h2 id="resources-title">机器人可用资源</h2>
                    </div>
                </div>
                <div class="resource-summary">
                    <a class="summary-card" href="/coordinates.html">
                        <span>命名坐标</span>
                        <strong id="coordinate-count">--</strong>
                    </a>
                    <a class="summary-card" href="/tasks.html">
                        <span>自定义任务</span>
                        <strong id="automation-count">--</strong>
                    </a>
                    <a class="summary-card" href="/storage.html">
                        <span>可交互容器</span>
                        <strong id="container-count">--</strong>
                    </a>
                    <a class="summary-card" href="/tasks.html">
                        <span>拾取流程</span>
                        <strong id="pickup-count">--</strong>
                    </a>
                </div>
                <div id="dashboard-errors" class="config-errors" role="alert"></div>
            </section>

            <section class="panel wide" aria-labelledby="recent-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">最近任务</p>
                        <h2 id="recent-title">执行记录</h2>
                    </div>
                    <a class="text-link" href="/tasks.html">查看全部</a>
                </div>
                <div id="recent-tasks" class="card-list" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
