<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>库存管理 · Stowling</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/workbench.css">
    <script src="/common.js" defer></script>
    <script src="/warehouse-model.js" defer></script>
    <script src="/storage.js" defer></script>
</head>
<body data-page="storage">
    <header class="topbar">
        <div class="brand">
            <img class="brand-mark" src="/icon.png" width="36" height="36" alt="">
            <div><h1>Stowling 控制台</h1><p>库存管理 · Chest Tracker 容器记录</p></div>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>
    <main>
        <div id="auth-shell"></div>
        <div id="workspace" class="workspace page-workspace" aria-hidden="true">
            <nav id="app-nav" class="workspace-nav" aria-label="页面导航"></nav>
            <section class="panel wide" aria-labelledby="inventory-title">
                <div class="panel-heading">
                    <div><p class="eyebrow">CHEST TRACKER</p>
                        <h2 id="inventory-title">仓库库存</h2>
                        <p class="muted compact-help">默认汇总当前记忆库的全部实体容器。</p>
                    </div>
                    <button id="refresh-storage-button" class="secondary" type="button">刷新记录</button>
                </div>
                <div class="warehouse-filters">
                    <label>查看范围<select id="inventory-area">
                        <option value="">整个仓库</option></select></label>
                    <label>搜索物品<input id="inventory-query" type="search"
                        placeholder="输入名称或物品 ID"></label>
                </div>
                <div id="inventory-metrics" class="warehouse-metrics"></div>
                <p id="storage-message" class="field-message" role="status" aria-live="polite"></p>
                <p class="muted compact-help warehouse-help">
                    物品数量＝散装＋潜影盒内物品，按属性分别统计。
                    选择区域时，按角色当前所在世界的坐标范围筛选。
                    未满盒与满盒的外壳计入盒子统计，空盒作为物品列出。
                    刷新记录不会驱动机器人盘点；箱子被其他人改动后，请重新打开以更新记录。
                </p>
                <div id="inventory-list" aria-live="polite"></div>
                <div class="warehouse-pagination">
                    <button id="inventory-previous" type="button" class="ghost">上一页</button>
                    <span id="inventory-page" class="muted compact-help"></span>
                    <button id="inventory-next" type="button" class="ghost">下一页</button>
                </div>
            </section>
        </div>
    </main>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
