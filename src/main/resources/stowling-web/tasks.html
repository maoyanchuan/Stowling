<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>移动任务 · Stowling</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/common.js" defer></script>
    <script src="/coordinate-model.js" defer></script>
    <script src="/v2-task-model.js" defer></script>
    <script src="/v2-task-editor.js" defer></script>
    <script src="/tasks.js" defer></script>
</head>
<body data-page="tasks">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">S</span>
            <div>
                <h1>移动任务</h1>
                <p>组合线性模块并手动运行</p>
            </div>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>

    <main>
        <div id="auth-shell"></div>
        <div id="workspace" class="workspace page-workspace" aria-hidden="true">
            <nav id="app-nav" class="workspace-nav" aria-label="页面导航"></nav>

            <section class="panel task-sidebar" aria-labelledby="task-list-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">任务定义</p>
                        <h2 id="task-list-title">任务列表</h2>
                    </div>
                    <button id="new-task-button" class="primary compact"
                            type="button">新建任务</button>
                </div>
                <p id="task-list-message" class="field-message" role="status"></p>
                <div id="task-list" class="editor-list"></div>
            </section>

            <section class="panel task-editor-panel" aria-labelledby="task-editor-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">线性模块</p>
                        <h2 id="task-editor-title">任务编辑器</h2>
                    </div>
                    <span id="task-revision" class="loopback-tag">新任务</span>
                </div>
                <div id="task-empty" class="empty-state">选择任务或新建任务</div>
                <form id="task-form" hidden novalidate>
                    <div class="editor-field">
                        <label for="task-name">任务名称</label>
                        <input id="task-name" maxlength="80" required>
                    </div>
                    <div class="step-heading">
                        <div>
                            <h3>模块步骤</h3>
                            <p class="muted compact-help">按顺序执行，可添加、修改、删除和排序。</p>
                        </div>
                        <button id="add-step-button" class="secondary compact"
                                type="button">添加步骤</button>
                    </div>
                    <div id="task-steps" class="step-list"></div>
                    <div id="task-errors" class="config-errors" role="alert"></div>
                    <div class="action-row">
                        <button id="save-task-button" class="primary compact"
                                type="submit">保存任务</button>
                        <button id="discard-task-button" class="secondary compact"
                                type="button">放弃修改</button>
                        <button id="delete-task-button"
                                class="ghost compact danger-action"
                                type="button">删除任务</button>
                    </div>
                </form>
            </section>

            <section id="task-module-panel" class="panel wide"
                     aria-labelledby="task-module-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">模块目录</p>
                        <h2 id="task-module-title">可用模块</h2>
                        <p class="muted section-help">
                            步骤编辑器中的模块和参数字段由后端模块目录自动生成。
                        </p>
                    </div>
                    <span id="task-module-count" class="loopback-tag">--</span>
                </div>
                <div id="task-module-catalog" class="module-catalog"
                     aria-live="polite"></div>
            </section>

            <section id="task-run-panel" class="panel wide"
                     aria-labelledby="task-run-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">执行</p>
                        <h2 id="task-run-title">运行任务</h2>
                        <p class="muted section-help">
                            选择已保存的任务并运行，不会使用编辑器中未保存的修改。
                        </p>
                    </div>
                </div>
                <div class="task-launch-grid">
                    <div class="editor-field">
                        <label for="run-task-select">已保存任务</label>
                        <select id="run-task-select">
                            <option value="">请选择任务</option>
                        </select>
                    </div>
                    <button id="run-task-button" class="primary compact"
                            type="button">运行所选任务</button>
                </div>
            </section>

            <section class="panel wide" aria-labelledby="runtime-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">手动执行</p>
                        <h2 id="runtime-title">运行状态</h2>
                    </div>
                    <button id="refresh-runs-button" class="secondary compact"
                            type="button">刷新状态</button>
                </div>
                <div id="runtime-list" class="card-list" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
