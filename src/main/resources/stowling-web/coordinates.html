<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>坐标管理 · Stowling</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/common.js" defer></script>
    <script src="/coordinate-model.js" defer></script>
    <script src="/region-model.js" defer></script>
    <script src="/coordinates.js" defer></script>
</head>
<body data-page="coordinates">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">S</span>
            <div>
                <h1>坐标管理</h1>
                <p>保存任务可复用的坐标点</p>
            </div>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>

    <main>
        <div id="auth-shell"></div>
        <div id="workspace" class="workspace page-workspace" aria-hidden="true">
            <nav id="app-nav" class="workspace-nav" aria-label="页面导航"></nav>

            <section class="panel wide" aria-labelledby="coordinate-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">共享资源</p>
                        <h2 id="coordinate-title">坐标点</h2>
                        <p class="muted section-help">
                            坐标按名称和 X/Y/Z 保存，可按需附带维度和到达半径。
                        </p>
                    </div>
                    <div class="action-row">
                        <button id="add-coordinate-button"
                                class="secondary compact"
                                type="button">添加坐标</button>
                        <button id="add-region-button" class="primary compact"
                                type="button">添加区域</button>
                    </div>
                </div>

                <div class="resource-create-grid">
                    <form id="new-coordinate-form"
                          class="coordinate-create-form" hidden>
                        <div class="coordinate-create-heading">
                            <div>
                                <p class="eyebrow">新增资源</p>
                                <h3>添加坐标</h3>
                                <p class="compact-help">
                                    名称与 X/Y/Z 必填，维度和半径可按需开启。
                                </p>
                            </div>
                            <button id="cancel-coordinate-button"
                                    class="ghost compact" type="button">关闭</button>
                        </div>
                        <div class="coordinate-create-fields">
                            <div class="editor-field coordinate-name-field">
                                <label for="new-coordinate-name">名称</label>
                                <input id="new-coordinate-name"
                                       maxlength="80" required>
                            </div>
                            <div class="editor-field">
                                <label for="new-coordinate-x">X</label>
                                <input id="new-coordinate-x" type="number"
                                       step="1" value="0" required>
                            </div>
                            <div class="editor-field">
                                <label for="new-coordinate-y">Y</label>
                                <input id="new-coordinate-y" type="number"
                                       step="1" value="64" required>
                            </div>
                            <div class="editor-field">
                                <label for="new-coordinate-z">Z</label>
                                <input id="new-coordinate-z" type="number"
                                       step="1" value="0" required>
                            </div>
                            <div class="editor-field coordinate-optional-field">
                                <label class="coordinate-switch"
                                       for="new-coordinate-use-dimension">
                                    <input id="new-coordinate-use-dimension"
                                           type="checkbox">
                                    <span>指定维度</span>
                                </label>
                                <input id="new-coordinate-dimension"
                                       value="minecraft:overworld"
                                       placeholder="minecraft:overworld"
                                       disabled hidden>
                            </div>
                            <div class="editor-field coordinate-optional-field">
                                <label class="coordinate-switch"
                                       for="new-coordinate-use-radius">
                                    <input id="new-coordinate-use-radius"
                                           type="checkbox">
                                    <span>指定半径</span>
                                </label>
                                <input id="new-coordinate-radius" type="number"
                                       min="0" max="128" step="1" value="3"
                                       disabled hidden>
                            </div>
                        </div>
                        <div class="coordinate-create-actions">
                            <button class="primary compact"
                                    type="submit">保存坐标</button>
                        </div>
                    </form>

                    <form id="new-region-form"
                          class="coordinate-create-form" hidden>
                        <div class="coordinate-create-heading">
                            <div>
                                <p class="eyebrow">新增资源</p>
                                <h3>添加区域</h3>
                                <p class="compact-help">
                                    输入两个三维角点，区域会包含两个端点。
                                </p>
                            </div>
                            <button id="cancel-region-button"
                                    class="ghost compact" type="button">关闭</button>
                        </div>
                        <div class="region-create-fields">
                            <div class="editor-field">
                                <label for="new-region-name">区域名称</label>
                                <input id="new-region-name"
                                       maxlength="80" required>
                            </div>
                            <fieldset class="region-corner-group">
                                <legend>角点 1</legend>
                                <div class="coordinate-axis-row">
                                    <div class="editor-field">
                                        <label for="new-region-first-x">X</label>
                                        <input id="new-region-first-x"
                                               type="number" step="1"
                                               value="0" required>
                                    </div>
                                    <div class="editor-field">
                                        <label for="new-region-first-y">Y</label>
                                        <input id="new-region-first-y"
                                               type="number" step="1"
                                               value="64" required>
                                    </div>
                                    <div class="editor-field">
                                        <label for="new-region-first-z">Z</label>
                                        <input id="new-region-first-z"
                                               type="number" step="1"
                                               value="0" required>
                                    </div>
                                </div>
                            </fieldset>
                            <fieldset class="region-corner-group">
                                <legend>角点 2</legend>
                                <div class="coordinate-axis-row">
                                    <div class="editor-field">
                                        <label for="new-region-second-x">X</label>
                                        <input id="new-region-second-x"
                                               type="number" step="1"
                                               value="0" required>
                                    </div>
                                    <div class="editor-field">
                                        <label for="new-region-second-y">Y</label>
                                        <input id="new-region-second-y"
                                               type="number" step="1"
                                               value="64" required>
                                    </div>
                                    <div class="editor-field">
                                        <label for="new-region-second-z">Z</label>
                                        <input id="new-region-second-z"
                                               type="number" step="1"
                                               value="0" required>
                                    </div>
                                </div>
                            </fieldset>
                        </div>
                        <div class="coordinate-create-actions">
                            <button class="primary compact"
                                    type="submit">保存区域</button>
                        </div>
                    </form>
                </div>

                <div class="resource-list-grid">
                    <section class="resource-list-section"
                             aria-labelledby="coordinate-list-title">
                        <div class="resource-section-heading">
                            <div>
                                <h3 id="coordinate-list-title">坐标点</h3>
                                <p class="muted compact-help">
                                    可被任务引用的单点坐标。
                                </p>
                            </div>
                        </div>
                        <div id="coordinate-list" class="editor-list"
                             aria-live="polite"></div>
                    </section>

                    <section class="resource-list-section"
                             aria-labelledby="region-list-title">
                        <div class="resource-section-heading">
                            <div>
                                <h3 id="region-list-title">区域</h3>
                                <p class="muted compact-help">
                                    由两个三维角点定义的共享长方体区域。
                                </p>
                            </div>
                        </div>
                        <div id="region-list" class="editor-list"
                             aria-live="polite"></div>
                    </section>
                </div>
                <div id="coordinate-errors" class="config-errors" role="alert"></div>
                <div class="coordinate-footer">
                    <span id="coordinate-status">尚未读取坐标</span>
                    <code id="coordinate-revision">配置版本：--</code>
                </div>
            </section>
        </div>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
