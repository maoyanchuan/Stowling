<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>背包管理 · Stowling</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/workbench.css">
    <script src="/common.js" defer></script>
    <script src="/backpack-model.js" defer></script>
    <script src="/backpack.js" defer></script>
</head>
<body data-page="backpack">
    <header class="topbar">
        <div class="brand">
            <img class="brand-mark" src="/icon.png" width="36" height="36" alt="">
            <div><h1>Stowling 控制台</h1><p>背包管理 · 自用与任务物品</p></div>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>
    <main>
        <div id="auth-shell">
            <p class="route-loading" role="status">正在载入控制台…</p>
        </div>
        <div id="workspace" class="workspace page-workspace" aria-hidden="true">
            <nav id="app-nav" class="workspace-nav" aria-label="页面导航"></nav>
            <section class="panel wide" aria-labelledby="backpack-title">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">全局物品归属</p>
                        <h2 id="backpack-title">当前背包</h2>
                        <p class="muted compact-help">
                            在已启用的自动收集点捡到的投料会送往该点的缓存，任务启动前捡到的也算。
                            自用物品换格后仍受保护。其余物品进入待分类，
                            包括原有物品、寻路时捡到的杂物和空闲时收到的投料。
                        </p>
                    </div>
                    <button id="backpack-refresh" class="secondary" type="button">刷新背包</button>
                </div>
                <p id="backpack-status" class="field-message" role="status"></p>
                <div class="backpack-browser">
                    <div>
                        <div id="backpack-items" class="backpack-items"
                             role="group" aria-label="背包和快捷栏"></div>
                        <p id="backpack-empty" class="muted compact-help" hidden>背包中没有物品</p>
                    </div>
                    <form id="backpack-editor" class="backpack-editor" hidden>
                        <h3 id="backpack-item-name"></h3>
                        <p id="backpack-item-id" class="muted compact-help"></p>
                        <p id="backpack-counts"></p>
                        <label class="move-field">
                            <span>保留自用数量</span>
                            <input id="backpack-keep" type="number" min="0" step="1" required>
                        </label>
                        <p id="backpack-preview" class="muted compact-help" aria-live="polite"></p>
                        <div class="move-form-actions">
                            <button id="backpack-keep-all" class="secondary" type="button">
                                全部保留自用
                            </button>
                            <button id="backpack-classify-all" class="secondary" type="button">
                                全部交给分类
                            </button>
                            <button id="backpack-save" class="primary" type="submit">保存分配</button>
                        </div>
                        <p class="muted compact-help">
                            任务和收尾运行时可以查看背包，结束后可调整归属。
                            分类物品先放入已启用自动分类任务的缓存，再按仓储排版入库。
                        </p>
                    </form>
                </div>
                <p id="backpack-message" class="field-message" role="status" aria-live="polite"></p>
            </section>
        </div>
    </main>
    <div id="backpack-tooltip" class="backpack-tooltip" role="tooltip" hidden></div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
