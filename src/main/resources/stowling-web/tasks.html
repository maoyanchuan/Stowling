<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>任务管理 · Stowling</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/common.js" defer></script>
    <script src="/v2-task-model.js" defer></script>
    <script src="/coordinate-model.js" defer></script>
    <script src="/move-task-model.js" defer></script>
    <script src="/task-monitor-model.js" defer></script>
    <script src="/tasks.js" defer></script>
</head>
<body data-page="tasks">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">S</span>
            <div>
                <h1>Stowling 控制台</h1>
                <p>任务管理 · 移动任务与运行队列</p>
            </div>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>

    <main>
        <div id="auth-shell"></div>
        <div id="workspace" class="workspace page-workspace" aria-hidden="true">
            <nav id="app-nav" class="workspace-nav" aria-label="页面导航"></nav>

            <div class="task-console">
                <aside class="task-monitor-rail" aria-label="任务运行与日志">
                    <section class="panel task-queue-panel" aria-labelledby="queue-title">
                        <div class="panel-heading rail-heading">
                            <h2 id="queue-title">运行队列</h2>
                            <div class="rail-heading-actions">
                                <span id="task-queue-count" class="count-label">0</span>
                                <button id="refresh-runs-button" class="ghost compact"
                                        type="button" title="刷新运行状态">刷新</button>
                            </div>
                        </div>
                        <p class="rail-caption">紧急 → 普通 → 后台 · 排队与监听</p>
                        <p id="task-monitor-message" class="rail-sync-state"
                           role="status">等待连接</p>
                        <div id="task-queue-list" class="rail-queue-list"
                             aria-live="polite"></div>
                    </section>
                    <section class="panel task-log-panel" aria-labelledby="task-log-title">
                        <div class="panel-heading rail-heading">
                            <h2 id="task-log-title">日志输出</h2>
                            <span id="task-log-count" class="count-label">0</span>
                        </div>
                        <div class="rail-log-actions" role="group" aria-label="日志操作">
                            <button id="export-task-logs" class="ghost compact"
                                    type="button" disabled>导出</button>
                            <button id="clear-task-logs" class="ghost compact"
                                    type="button" disabled>清空</button>
                            <button id="pause-task-log-scroll" class="ghost compact"
                                    type="button" aria-pressed="false">暂停滚动</button>
                            <button id="show-run-details" class="ghost compact"
                                    type="button">运行详情</button>
                        </div>
                        <p class="rail-caption">本页任务状态变化 · 最多保留 300 条</p>
                        <div id="task-log-list" class="rail-log-list" role="log"
                             aria-label="任务状态日志" aria-live="off" tabindex="0"></div>
                    </section>
                </aside>
                <div id="task-selection-area" class="task-workbench"
                     aria-label="任务展示与选择">
                    <section id="task-display-area" class="panel task-display-placeholder"
                             aria-labelledby="task-display-title">
                        <div class="panel-heading">
                            <h2 id="task-display-title">任务展示</h2>
                        </div>
                        <p id="move-task-placeholder" class="muted move-placeholder">
                            选择下方的移动任务，配置目标位置。
                        </p>
                        <form id="move-task-form" class="move-task-form" hidden novalidate>
                            <fieldset id="move-task-fields" disabled>
                                <label class="move-field" for="move-task-name">
                                    <span>任务名称</span>
                                    <input id="move-task-name" maxlength="80" required
                                           autocomplete="off" value="移动到坐标">
                                </label>
                                <div class="move-target-heading">
                                    <span>目标位置</span>
                                    <div class="move-source-switch" role="group"
                                         aria-label="坐标来源">
                                        <button type="button" data-move-source="manual"
                                                aria-pressed="true">手动输入</button>
                                        <button type="button" data-move-source="saved"
                                                aria-pressed="false">已保存坐标</button>
                                    </div>
                                </div>
                                <div id="move-manual-target" class="move-axis-grid">
                                    <label class="move-field" for="move-target-x">
                                        <span>X</span>
                                        <input id="move-target-x" type="number" step="1"
                                               min="-2147483648" max="2147483647"
                                               placeholder="例如 120" required>
                                    </label>
                                    <label class="move-field" for="move-target-y">
                                        <span>Y</span>
                                        <input id="move-target-y" type="number" step="1"
                                               min="-2147483648" max="2147483647"
                                               placeholder="例如 64" required>
                                    </label>
                                    <label class="move-field" for="move-target-z">
                                        <span>Z</span>
                                        <input id="move-target-z" type="number" step="1"
                                               min="-2147483648" max="2147483647"
                                               placeholder="例如 -80" required>
                                    </label>
                                </div>
                                <div id="move-saved-target" class="move-field" hidden>
                                    <label for="move-saved-coordinate">选择坐标</label>
                                    <select id="move-saved-coordinate">
                                        <option value="">请选择已保存坐标</option>
                                    </select>
                                </div>
                                <p id="move-target-note" class="move-target-note">
                                    手动坐标在当前维度生效，不会新增坐标点。
                                </p>
                                <label class="move-field move-priority" for="move-priority">
                                    <span>运行优先级</span>
                                    <select id="move-priority">
                                        <option value="NORMAL">普通</option>
                                        <option value="URGENT">紧急</option>
                                        <option value="BACKGROUND">后台</option>
                                    </select>
                                </label>
                                <p id="move-task-message" class="field-message"
                                   role="status" aria-live="polite"></p>
                                <div class="move-form-actions">
                                    <button id="save-move-task" class="secondary"
                                            type="button">保存任务</button>
                                    <button id="run-move-task" class="primary"
                                            type="submit">保存并加入队列</button>
                                </div>
                            </fieldset>
                        </form>
                    </section>
                    <section class="panel task-selection-panel"
                             aria-labelledby="task-list-title">
                        <div class="panel-heading">
                            <h2 id="task-list-title">任务选择</h2>
                            <button id="refresh-move-tasks" class="ghost compact"
                                    type="button">刷新</button>
                        </div>
                        <p id="move-resources-message" class="field-message"
                           role="status">连接后可创建移动任务</p>
                        <div class="move-task-options">
                            <button id="new-move-task" class="move-task-option is-new"
                                    type="button" disabled>
                                <strong>＋ 移动到坐标</strong>
                                <span>新建一个单步移动任务</span>
                            </button>
                            <div id="move-task-list" class="move-task-list"
                                 aria-label="已保存的移动任务"></div>
                        </div>
                    </section>
                </div>
            </div>
            <dialog id="task-run-details" class="task-run-dialog"
                    aria-labelledby="runtime-title">
                <div class="panel-heading">
                    <h2 id="runtime-title">运行详情</h2>
                    <button id="close-run-details" class="secondary compact"
                            type="button">关闭</button>
                </div>
                <div id="runtime-list" class="card-list" aria-live="polite"></div>
            </dialog>
        </div>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
