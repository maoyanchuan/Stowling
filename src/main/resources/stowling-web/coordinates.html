<!doctype html>
<html lang="zh-CN" data-theme="green">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>坐标管理 · Stowling</title>
    <script src="/theme.js" blocking="render"></script>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/workbench.css">
    <link rel="stylesheet" href="/coordinate-editor.css">
    <script src="/common.js" defer></script>
    <script src="/category-zone-model.js" defer></script>
    <script src="/coordinate-editor-model.js" defer></script>
    <script src="/coordinate-editor.js" defer></script>
</head>
<body data-page="coordinates" data-coordinate-editor>
    <header class="page-header">
        <div class="page-brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"/>
                    <circle cx="12" cy="9" r="2.2"/>
                </svg>
            </span>
            <div>
                <strong>Stowling 控制台</strong>
                <span>坐标管理</span>
            </div>
        </div>
        <div class="theme-picker" aria-label="主题切换">
            <button type="button" data-theme-choice="green" aria-pressed="true">
                浅绿
            </button>
            <button type="button" data-theme-choice="gray" aria-pressed="false">
                深灰
            </button>
        </div>
        <div class="connection-state">
            <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
            <span id="connection-label">未连接</span>
        </div>
    </header>

    <main class="page-main">
        <div id="auth-shell">
            <p class="route-loading" role="status">正在载入控制台…</p>
        </div>
        <div id="workspace" class="workspace" aria-hidden="true">
            <nav id="app-nav" class="workspace-nav" aria-label="页面导航"></nav>
            <div class="page-heading">
                <h1>坐标管理</h1>
                <p>集中维护任务会用到的常用位置。选择左侧资源，在右侧编辑名称和范围信息。</p>
            </div>

            <section class="coordinate-shell" aria-label="坐标管理与编辑">
                <aside class="coordinate-column coordinate-library" aria-labelledby="library-title">
                    <div class="column-heading">
                        <div>
                            <h2 id="library-title">坐标管理</h2>
                            <p>选择一个坐标点、区域或分类区开始编辑</p>
                        </div>
                        <div class="column-actions">
                            <button id="add-coordinate" class="primary" type="button">添加位置</button>
                            <button id="add-folder" type="button">新建文件夹</button>
                        </div>
                    </div>

                    <form id="folder-form" class="folder-create-form" hidden>
                        <label class="field-label" for="folder-name">
                            文件夹名称
                            <input id="folder-name" maxlength="40" required>
                        </label>
                        <div class="folder-form-actions">
                            <button class="primary" type="submit">创建文件夹</button>
                            <button id="cancel-folder" class="ghost" type="button">取消</button>
                        </div>
                    </form>

                    <div id="coordinate-list" class="coordinate-list" role="listbox"
                         aria-label="坐标列表"></div>
                    <p id="library-footer" class="library-footer" role="status"></p>
                </aside>

                <section class="coordinate-column coordinate-editor" aria-labelledby="editor-title">
                    <div id="editor-empty" class="empty-state" hidden>
                        <div>
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                                 stroke-linejoin="round">
                                <path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"/>
                                <circle cx="12" cy="9" r="2.2"/>
                            </svg>
                            <p>还没有位置资源，点击左侧“添加”创建一个。</p>
                        </div>
                    </div>

                    <div id="editor-content">
                        <div class="column-heading">
                            <div>
                                <h2 id="editor-title">坐标编辑</h2>
                                <p id="editor-subtitle">编辑当前坐标的基本信息</p>
                            </div>
                        </div>

                        <div id="coordinate-kind-picker" class="coordinate-kind-picker editor-kind-picker"
                             hidden>
                            <div class="field-label">
                                <span id="coordinate-kind-label">新增类型</span>
                                <div class="coordinate-kind-select">
                                    <select id="coordinate-kind" hidden aria-hidden="true">
                                        <option value="point">坐标点</option>
                                        <option value="region">区域</option>
                                        <option value="category-zone">分类区</option>
                                    </select>
                                    <button id="coordinate-kind-trigger" class="coordinate-kind-trigger"
                                            type="button" role="combobox" aria-haspopup="listbox"
                                            aria-expanded="false" aria-controls="coordinate-kind-menu"
                                            aria-labelledby="coordinate-kind-label
                                                coordinate-kind-current">
                                        <span id="coordinate-kind-current"
                                              class="coordinate-kind-current">坐标点</span>
                                        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"
                                             fill="none" stroke="currentColor" stroke-width="1.8">
                                            <path d="m6 9 6 6 6-6"/>
                                        </svg>
                                    </button>
                                    <div id="coordinate-kind-menu" class="coordinate-kind-menu"
                                         role="listbox" aria-labelledby="coordinate-kind-label" hidden>
                                        <button class="coordinate-kind-option" type="button" role="option"
                                                data-coordinate-kind="point" aria-selected="true"
                                                tabindex="-1">
                                            <span>坐标点<small>单个三维位置和半径</small></span>
                                            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"
                                                 fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="m5 12 4 4L19 6"/>
                                            </svg>
                                        </button>
                                        <button class="coordinate-kind-option" type="button" role="option"
                                                data-coordinate-kind="region" aria-selected="false"
                                                tabindex="-1">
                                            <span>区域<small>用两个三维角点定义范围</small></span>
                                            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"
                                                 fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="m5 12 4 4L19 6"/>
                                            </svg>
                                        </button>
                                        <button class="coordinate-kind-option" type="button" role="option"
                                                data-coordinate-kind="category-zone" aria-selected="false"
                                                tabindex="-1">
                                            <span>分类区<small>配置标识物识别区域和储存区</small>
                                            </span>
                                            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"
                                                 fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="m5 12 4 4L19 6"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <form id="coordinate-form" class="editor-form">
                            <div class="editor-fields">
                                <label class="field-label" for="coordinate-name">
                                    名称
                                    <input id="coordinate-name" name="name" maxlength="80" required>
                                </label>
                                <label class="field-label" data-point-field for="coordinate-x">
                                    X
                                    <input id="coordinate-x" name="x" type="number" step="1" required>
                                </label>
                                <label class="field-label" data-point-field for="coordinate-y">
                                    Y
                                    <input id="coordinate-y" name="y" type="number" step="1" required>
                                </label>
                                <label class="field-label" data-point-field for="coordinate-z">
                                    Z
                                    <input id="coordinate-z" name="z" type="number" step="1" required>
                                </label>

                                <div id="region-fields" class="coordinate-kind-fields" hidden>
                                    <div class="coordinate-region-grid">
                                        <fieldset class="coordinate-region-card">
                                            <legend>角点 1</legend>
                                            <div class="coordinate-corner-fields">
                                                <label class="field-label" for="region-first-x">
                                                    X
                                                    <input id="region-first-x" type="number" step="1"
                                                           required>
                                                </label>
                                                <label class="field-label" for="region-first-y">
                                                    Y
                                                    <input id="region-first-y" type="number" step="1"
                                                           required>
                                                </label>
                                                <label class="field-label" for="region-first-z">
                                                    Z
                                                    <input id="region-first-z" type="number" step="1"
                                                           required>
                                                </label>
                                            </div>
                                        </fieldset>
                                        <fieldset class="coordinate-region-card">
                                            <legend>角点 2</legend>
                                            <div class="coordinate-corner-fields">
                                                <label class="field-label" for="region-second-x">
                                                    X
                                                    <input id="region-second-x" type="number" step="1"
                                                           required>
                                                </label>
                                                <label class="field-label" for="region-second-y">
                                                    Y
                                                    <input id="region-second-y" type="number" step="1"
                                                           required>
                                                </label>
                                                <label class="field-label" for="region-second-z">
                                                    Z
                                                    <input id="region-second-z" type="number" step="1"
                                                           required>
                                                </label>
                                            </div>
                                        </fieldset>
                                    </div>
                                </div>

                                <div id="category-zone-fields" class="coordinate-kind-fields" hidden>
                                    <div class="coordinate-region-stack">
                                        <fieldset class="coordinate-region-card">
                                            <legend>总选区</legend>
                                            <div class="coordinate-corner-fields">
                                                <label class="field-label" for="category-overall-first-x">
                                                    X1
                                                    <input id="category-overall-first-x" type="number"
                                                           step="1"
                                                           required>
                                                </label>
                                                <label class="field-label" for="category-overall-first-y">
                                                    Y1
                                                    <input id="category-overall-first-y" type="number"
                                                           step="1"
                                                           required>
                                                </label>
                                                <label class="field-label" for="category-overall-first-z">
                                                    Z1
                                                    <input id="category-overall-first-z" type="number"
                                                           step="1"
                                                           required>
                                                </label>
                                                <label class="field-label" for="category-overall-second-x">
                                                    X2
                                                    <input id="category-overall-second-x" type="number"
                                                           step="1"
                                                           required>
                                                </label>
                                                <label class="field-label" for="category-overall-second-y">
                                                    Y2
                                                    <input id="category-overall-second-y" type="number"
                                                           step="1"
                                                           required>
                                                </label>
                                                <label class="field-label" for="category-overall-second-z">
                                                    Z2
                                                    <input id="category-overall-second-z" type="number"
                                                           step="1"
                                                           required>
                                                </label>
                                            </div>
                                        </fieldset>
                                        <div class="category-options">
                                            <div class="category-option-row">
                                                <span class="category-option-label">储存模式</span>
                                                <div class="category-select-wrap" data-category-select="scopeMode">
                                                    <select id="category-scope-mode" hidden
                                                            aria-hidden="true" tabindex="-1">
                                                        <option value="single">单片模式</option>
                                                        <option value="selection">选区模式</option>
                                                    </select>
                                                    <button id="category-scope-mode-trigger"
                                                            class="category-select-trigger" type="button"
                                                            role="combobox" aria-haspopup="listbox"
                                                            aria-expanded="false"
                                                            aria-controls="category-scope-mode-menu"
                                                            aria-label="储存模式">
                                                        <span id="category-scope-mode-current"
                                                              class="category-select-current">单片模式</span>
                                                        <svg aria-hidden="true" width="18" height="18"
                                                             viewBox="0 0 24 24" fill="none"
                                                             stroke="currentColor" stroke-width="1.8">
                                                            <path d="m6 9 6 6 6-6"/>
                                                        </svg>
                                                    </button>
                                                    <div id="category-scope-mode-menu"
                                                         class="category-select-menu" role="listbox"
                                                         aria-label="储存模式" hidden>
                                                        <button class="category-select-option" type="button"
                                                                role="option" data-category-value="single"
                                                                aria-selected="true" tabindex="-1">
                                                            <span>单片模式<small>按单片自动拓展</small></span>
                                                            <svg aria-hidden="true" width="18" height="18"
                                                                 viewBox="0 0 24 24" fill="none"
                                                                 stroke="currentColor" stroke-width="2">
                                                                <path d="m5 12 4 4L19 6"/>
                                                            </svg>
                                                        </button>
                                                        <button class="category-select-option" type="button"
                                                                role="option" data-category-value="selection"
                                                                aria-selected="false" tabindex="-1">
                                                            <span>选区模式<small>按选区统一管理</small></span>
                                                            <svg aria-hidden="true" width="18" height="18"
                                                                 viewBox="0 0 24 24" fill="none"
                                                                 stroke="currentColor" stroke-width="2">
                                                                <path d="m5 12 4 4L19 6"/>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="category-option-row">
                                                <span class="category-option-label">识别模式</span>
                                                <div class="category-select-wrap"
                                                     data-category-select="recognitionMode">
                                                    <select id="category-recognition-mode" hidden
                                                            aria-hidden="true" tabindex="-1">
                                                        <option value="marker">标识物模式</option>
                                                        <option value="container-item">容器内物品识别</option>
                                                    </select>
                                                    <button id="category-recognition-mode-trigger"
                                                            class="category-select-trigger" type="button"
                                                            role="combobox" aria-haspopup="listbox"
                                                            aria-expanded="false"
                                                            aria-controls="category-recognition-mode-menu"
                                                            aria-label="识别模式">
                                                        <span id="category-recognition-mode-current"
                                                              class="category-select-current">标识物模式</span>
                                                        <svg aria-hidden="true" width="18" height="18"
                                                             viewBox="0 0 24 24" fill="none"
                                                             stroke="currentColor" stroke-width="1.8">
                                                            <path d="m6 9 6 6 6-6"/>
                                                        </svg>
                                                    </button>
                                                    <div id="category-recognition-mode-menu"
                                                         class="category-select-menu" role="listbox"
                                                         aria-label="识别模式" hidden>
                                                        <button class="category-select-option" type="button"
                                                                role="option" data-category-value="marker"
                                                                aria-selected="true" tabindex="-1">
                                                            <span>标识物模式<small>识别标识物位置</small></span>
                                                            <svg aria-hidden="true" width="18" height="18"
                                                                 viewBox="0 0 24 24" fill="none"
                                                                 stroke="currentColor" stroke-width="2">
                                                                <path d="m5 12 4 4L19 6"/>
                                                            </svg>
                                                        </button>
                                                        <button class="category-select-option" type="button"
                                                                role="option"
                                                                data-category-value="container-item"
                                                                aria-selected="false" tabindex="-1">
                                                            <span>容器内物品识别<small>识别容器内物品</small></span>
                                                            <svg aria-hidden="true" width="18" height="18"
                                                                 viewBox="0 0 24 24" fill="none"
                                                                 stroke="currentColor" stroke-width="2">
                                                                <path d="m5 12 4 4L19 6"/>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="category-option-row">
                                                <span class="category-option-label">储存方式</span>
                                                <div class="category-select-wrap"
                                                     data-category-select="storageMethod">
                                                    <select id="category-storage-method" hidden
                                                            aria-hidden="true" tabindex="-1">
                                                        <option value="bulk">散货储存</option>
                                                        <option value="mixed">散货盒子混合储存</option>
                                                        <option value="box">纯盒储存</option>
                                                    </select>
                                                    <button id="category-storage-method-trigger"
                                                            class="category-select-trigger" type="button"
                                                            role="combobox" aria-haspopup="listbox"
                                                            aria-expanded="false"
                                                            aria-controls="category-storage-method-menu"
                                                            aria-label="储存方式">
                                                        <span id="category-storage-method-current"
                                                              class="category-select-current">散货储存</span>
                                                        <svg aria-hidden="true" width="18" height="18"
                                                             viewBox="0 0 24 24" fill="none"
                                                             stroke="currentColor" stroke-width="1.8">
                                                            <path d="m6 9 6 6 6-6"/>
                                                        </svg>
                                                    </button>
                                                    <div id="category-storage-method-menu"
                                                         class="category-select-menu" role="listbox"
                                                         aria-label="储存方式" hidden>
                                                        <button class="category-select-option" type="button"
                                                                role="option" data-category-value="bulk"
                                                                aria-selected="true" tabindex="-1">
                                                            <span>散货储存<small>单独存放散货物品</small></span>
                                                            <svg aria-hidden="true" width="18" height="18"
                                                                 viewBox="0 0 24 24" fill="none"
                                                                 stroke="currentColor" stroke-width="2">
                                                                <path d="m5 12 4 4L19 6"/>
                                                            </svg>
                                                        </button>
                                                        <button class="category-select-option" type="button"
                                                                role="option" data-category-value="mixed"
                                                                aria-selected="false" tabindex="-1">
                                                            <span>散货盒子混合储存<small>散货与盒子并用</small></span>
                                                            <svg aria-hidden="true" width="18" height="18"
                                                                 viewBox="0 0 24 24" fill="none"
                                                                 stroke="currentColor" stroke-width="2">
                                                                <path d="m5 12 4 4L19 6"/>
                                                            </svg>
                                                        </button>
                                                        <button class="category-select-option" type="button"
                                                                role="option" data-category-value="box"
                                                                aria-selected="false" tabindex="-1">
                                                            <span>纯盒储存<small>仅存放盒装物品</small></span>
                                                            <svg aria-hidden="true" width="18" height="18"
                                                                 viewBox="0 0 24 24" fill="none"
                                                                 stroke="currentColor" stroke-width="2">
                                                                <path d="m5 12 4 4L19 6"/>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                            <div id="category-no-cache-row" class="category-option-sub"
                                                 data-collapsed="true">
                                                <span class="category-option-label">不满盒存储位置</span>
                                                <div class="category-select-wrap"
                                                     data-category-select="noCacheLocation">
                                                    <select id="category-no-cache-location" hidden
                                                            aria-hidden="true" tabindex="-1">
                                                        <option value="inside-box">当前存储位置</option>
                                                        <option value="specified">指定缓存位置</option>
                                                    </select>
                                                    <button id="category-no-cache-location-trigger"
                                                            class="category-select-trigger" type="button"
                                                            role="combobox" aria-haspopup="listbox"
                                                            aria-expanded="false"
                                                            aria-controls="category-no-cache-location-menu"
                                                            aria-label="不满盒存储位置">
                                                        <span id="category-no-cache-location-current"
                                                              class="category-select-current">当前存储位置</span>
                                                        <svg aria-hidden="true" width="18" height="18"
                                                             viewBox="0 0 24 24" fill="none"
                                                             stroke="currentColor" stroke-width="1.8">
                                                            <path d="m6 9 6 6 6-6"/>
                                                        </svg>
                                                    </button>
                                                    <div id="category-no-cache-location-menu"
                                                         class="category-select-menu" role="listbox"
                                                         aria-label="不满盒存储位置" hidden>
                                                        <button class="category-select-option" type="button"
                                                                role="option"
                                                                data-category-value="inside-box"
                                                                aria-selected="true" tabindex="-1">
                                                            <span>当前存储位置<small>缓存到当前箱子内</small></span>
                                                            <svg aria-hidden="true" width="18" height="18"
                                                                 viewBox="0 0 24 24" fill="none"
                                                                 stroke="currentColor" stroke-width="2">
                                                                <path d="m5 12 4 4L19 6"/>
                                                            </svg>
                                                        </button>
                                                        <button class="category-select-option" type="button"
                                                                role="option" data-category-value="specified"
                                                                aria-selected="false" tabindex="-1">
                                                            <span>指定缓存位置<small>使用独立缓存位置</small></span>
                                                            <svg aria-hidden="true" width="18" height="18"
                                                                 viewBox="0 0 24 24" fill="none"
                                                                 stroke="currentColor" stroke-width="2">
                                                                <path d="m5 12 4 4L19 6"/>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="category-option-row">
                                                <span class="category-option-label">忽略支撑方块</span>
                                                <div class="category-option-actions">
                                                    <button id="category-support-expand"
                                                            class="category-option-expand" type="button"
                                                            aria-expanded="false"
                                                            aria-controls="category-support-block-row"
                                                            aria-label="展开支撑方块设置" hidden>
                                                        <svg aria-hidden="true" width="18" height="18"
                                                             viewBox="0 0 24 24" fill="none"
                                                             stroke="currentColor" stroke-width="1.8">
                                                            <path d="m9 18 6-6-6-6"/>
                                                        </svg>
                                                    </button>
                                                    <label class="category-option-switch"
                                                           for="category-ignore-support">
                                                        <input id="category-ignore-support" type="checkbox"
                                                               role="switch">
                                                    </label>
                                                </div>
                                            </div>
                                            <div id="category-support-block-row" class="category-option-sub"
                                                 data-collapsed="true">
                                                <span class="category-option-label">支撑方块</span>
                                                <label class="field-label" for="category-support-block">
                                                    <input id="category-support-block"
                                                           class="category-support-block-input" type="text"
                                                           maxlength="80" placeholder="例如：minecraft:stone">
                                                </label>
                                            </div>
                                        </div>
                                        <div class="category-binding-section">
                                            <div class="category-binding-heading">
                                                <div>
                                                    <strong>识别区与储存区</strong>
                                                    <p>每组绑定一个标识物识别区和一个储存区。</p>
                                                </div>
                                                <button id="add-category-binding" type="button">
                                                    添加绑定组
                                                </button>
                                            </div>
                                            <div id="category-bindings"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div id="point-options" class="editor-options">
                                <label class="field-label" for="coordinate-radius">
                                    半径
                                    <input id="coordinate-radius" name="radius" type="number" min="0"
                                           max="128" step="1" required>
                                </label>
                            </div>

                            <div class="editor-actions">
                                <div class="editor-actions-main">
                                    <button class="primary" type="submit">保存坐标</button>
                                    <button id="duplicate-coordinate" type="button">复制坐标</button>
                                </div>
                                <button id="delete-coordinate" class="ghost danger" type="button">
                                    删除坐标
                                </button>
